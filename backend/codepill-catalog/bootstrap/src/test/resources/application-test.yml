# Test overrides: no OTLP collector is running during CI/IT — sample nothing
# and keep export quiet. Containers inject datasource/redis via @ServiceConnection.
management:
  tracing:
    sampling:
      probability: 0.0

codepill:
  rate-limit:
    # off for the functional suite (it fires many writes from one subject);
    # enforcement itself is covered by WriteRateLimitFilterTest and HardenedProfileIT
    enabled: false
