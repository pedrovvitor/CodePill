{{- if .Values.networkPolicies.enabled }}
# Deny-by-default ingress inside the namespace (SECURITY.md §1 applied to the
# network layer); each allowance below is the full list of legitimate callers.
# Enforced by k3s' embedded network policy controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codepill-web-ingress
spec:
  podSelector:
    matchLabels:
      app: codepill-web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicies.ingressPodLabels | nindent 14 }}
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codepill-catalog-ingress
spec:
  podSelector:
    matchLabels:
      app: codepill-catalog
  policyTypes: [Ingress]
  ingress:
    # API traffic enters through the ingress controller only
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicies.ingressPodLabels | nindent 14 }}
      ports:
        - port: 8080
    # Management port: Prometheus scrape only (the anonymous /actuator/prometheus
    # exception is bounded by this rule)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.observabilityNamespace }}
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8081
{{- end }}
