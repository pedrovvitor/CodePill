{{- if .Values.ingress.enabled }}
# Single public host: the SPA is same-origin with its API (no CORS surface).
# Only /api/* reaches the catalog service — the actuator lives on the
# management port and is never routed here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codepill
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.domain }}
      secretName: codepill-web-tls
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: codepill-catalog
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codepill-web
                port:
                  name: http
{{- end }}
