# App-of-apps: applied once by the bootstrap script; from then on Argo CD
# reconciles everything in ops/k8s/apps from git (GitOps single source of truth).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: codepill-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pedrovvitor/CodePill.git
    targetRevision: main
    path: ops/k8s/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
