# gitleaks config — default rules plus an allowlist for the documented
# local-development fixtures (SECURITY.md §4.4). Deliberately narrow: only the
# fixture literal is allowlisted, never a whole file, so a real secret pasted
# anywhere (including the Keycloak realm export) is still caught.
title = "CodePill gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Documented local-dev fixture credentials"
paths = [
  '''\.env\.example$''',
]
regexes = [
  '''codepill-local''',
]
