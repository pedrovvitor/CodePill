# SonarQube — codepill-web (scanned by sonarsource/sonarqube-scan-action in CI;
# host/token come from the SONAR_HOST_URL / SONAR_TOKEN secrets).
sonar.projectKey=codepill-frontend
sonar.projectName=CodePill Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.exclusions=src/domain/catalog/api-types.gen.ts

# Same exclusions as the Vitest gate (TESTING_QUALITY.md §2: bootstrap wiring,
# generated code, test support).
sonar.coverage.exclusions=src/app/**,src/main.tsx,src/test/**,src/domain/catalog/api-types.gen.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Block the pipeline when the quality gate fails.
sonar.qualitygate.wait=true
